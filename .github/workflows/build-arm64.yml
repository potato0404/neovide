name: Build ARM64

on: [push]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        run: |
          rustup target add aarch64-unknown-linux-gnu
          
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libstdc++-13-dev-arm64-cross \
            pkg-config \
            libfreetype-dev \
            libfontconfig-dev

          sudo dpkg --add-architecture arm64

          # Adiciona sources ARM64
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/arm64.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list

          sudo apt update
          sudo apt install -y \
            libfreetype6-dev:arm64 \
            libfontconfig1-dev:arm64 \
            libstdc++-13-dev:arm64 \
            zlib1g-dev:arm64 \
            libpng-dev:arm64 \
            libexpat1-dev:arm64

      - name: Build
        run: |
          cargo build --release --target aarch64-unknown-linux-gnu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: /
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: neovide-aarch64
          path: target/aarch64-unknown-linux-gnu/release/neovide
