name: Build ARM64

on: [push]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        run: rustup target add aarch64-unknown-linux-gnu
          
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            pkg-config \
            libfreetype-dev \
            libfontconfig-dev \
            libfontconfig1-dev \
            libxcb-composite0-dev \
            libx11-dev \
            libxcb1-dev \
            cmake \
            clang \
            zlib1g-dev \
            libpng-dev \
            libexpat1-dev

      - name: Build
        run: cargo build --release
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: neovide-aarch64
          path: target/release/neovide
