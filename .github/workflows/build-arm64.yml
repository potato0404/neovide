name: Build Android ARM64

on: [push]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      
      - name: Install NDK
        run: |
          sudo apt update
          sudo apt install -y unzip wget
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "NDK_HOME=$PWD/android-ndk-r26d" >> $GITHUB_ENV

      - name: Install Rust
        run: rustup target add aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install dependencies
        run: |
          sudo apt install -y \
            pkg-config cmake clang python3 ninja-build

      - name: Build
        run: |
          cargo ndk -t arm64-v8a build --release
        env:
          ANDROID_NDK_HOME: ${{ env.NDK_HOME }}
          SKIA_BINARIES_URL: https://github.com/rust-skia/skia-binaries/releases/download
          SKIA_BINARIES_TAG: "0.93.0"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: neovide-android-arm64
          path: target/aarch64-linux-android/release/neovide
